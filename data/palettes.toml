# Colour palettes. Select one with `palette = "<name>"` in config.toml [extra].
# Each palette has a `dark` and a `light` table with the same keys:
#   bg, panel, fg, muted, line        structure
#   accent, accent-ink                brand block, key hints, bullets, hover / text on accent
#   c-title c-year c-link c-prompt c-who c-note   one colour per kind of element
# To add a palette: copy a block, rename it, change the hex values.
# Values start from each theme's official colours, then any text colour below WCAG AA (4.5:1 against bg
# and panel) is nudged lighter (dark) / darker (light) with its hue kept; accent needs 3:1.

# ── Catppuccin (Mocha / Latte) ─────────────────────────────────────────────

% tex4ht configuration for the paper pages (papers/README.md).
% Font sizes and old-style font switches mean nothing in HTML and trip up tex4ht's
% MathML ({\cal A} came out as a plain A, \mbox{\tiny N} lost its subscript), so
% they are neutralised here, for the HTML run only; the PDF is untouched.
\Preamble{xhtml,html5,mathml,fn-in}
\renewcommand\tiny{}\renewcommand\scriptsize{}\renewcommand\footnotesize{}
\renewcommand\small{}\renewcommand\large{}\renewcommand\Large{}
\renewcommand\cal[1]{\mathcal{#1}}
\renewcommand\rm{}\renewcommand\bf{}
% \mbox as a subscript (G_{\mbox{N}}) loses the subscript in tex4ht; inside maths it
% becomes \mathrm, which keeps it (outside maths \mbox is left alone)
\AtBeginDocument{\let\paperorigmbox\mbox
  \renewcommand\mbox[1]{\ifmmode\mathrm{#1}\else\paperorigmbox{#1}\fi}}
% bbm's \mathbbm has no MathML counterpart; blackboard bold is the same symbol
\providecommand\mathbbm{}\renewcommand\mathbbm[1]{\mathbb{#1}}
\begin{document}
% TeX4ht only starts at \begin{document}, so a _ inside a macro defined in the paper's
% preamble (\newcommand{\GN}{G_{\tn N}}) never becomes a MathML subscript.
% render.sh copies those definitions here, where they are read again with TeX4ht on.
\InputIfFileExists{paper-macros.tex}{}{}
\EndPreamble
